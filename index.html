<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYAD - وەرگرتنی دەقی سێرڤەر</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            width: 350px;
            border: 1px solid #00b4d8;
        }
        .brand-title {
            color: #00b4d8;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.6);
        }
        .subtitle {
            color: #a3cef1;
            font-size: 14px;
            margin-bottom: 15px;
        }
        textarea {
            width: 92%;
            height: 130px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00b4d8;
            background-color: #0b132b;
            color: #00f5d4;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            resize: none;
            direction: ltr;
            white-space: pre-wrap;
        }
        button {
            width: 98%;
            padding: 12px;
            background-color: #00b4d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5bc0be;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #ffb703;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-title">AYAD</div>
    <div class="subtitle">کردنەوە و وەرگرتنی ڕاستەوخۆی دەق</div>
    
    <textarea id="fetchedResultInput" placeholder="دەقەکە لێرە دەردەکەوێت..." readonly></textarea>
    <button id="fetchCodeBtn" onclick="getRawText(true)">نوێکردنەوە</button>
    <div id="timerNotice" class="status"></div>
</div>

<script>
    const directApiURL = "http://124.221.92.205:56133/api/free/v2/getcode?id=319199";
    let isFetching = false;

    async function getRawText(isManual = false) {
        if (isFetching) return;
        isFetching = true;

        const resultInput = document.getElementById('fetchedResultInput');
        const timerNotice = document.getElementById('timerNotice');

        if (isManual) {
            timerNotice.innerText = "لە هەوڵی وەرگرتندایە...";
        }

        try {
            // بەکارهێنانی corsproxy بۆ ئەوەی ڕاستەوخۆ دەقی لینکەکە لە براوسەردا بکاتەوە
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(directApiURL) + "&_t=" + Date.now();
            const response = await fetch(proxyUrl);
            const textData = await response.text();

            // هەموو دەقێک بەبێ دەستکاری نیشان دەدات
            resultInput.value = textData;
            timerNotice.style.color = "#4caf50";
            timerNotice.innerText = "وەڵامی لینکەکە بەسەرکەوتوویی هێنرا!";
        } catch (err) {
            timerNotice.style.color = "#f44336";
            timerNotice.innerText = "کێشە لە ڕاکێشانی دەقی لینکەکە.";
        } finally {
            isFetching = false;
        }
    }

    // بەگەڕخستنی ئۆتۆماتیکی
    window.onload = function() {
        getRawText();
        // بەردەوام هەر ١.٥ چرکە جارێک نوێی دەکاتەوە
        setInterval(() => getRawText(false), 1500);
    };
</script>

</body>
</html>
