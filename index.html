<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMAN - وەرگرتنی کۆد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            width: 320px;
            border: 1px solid #00b4d8;
        }
        .brand-title {
            color: #00b4d8;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.6);
            letter-spacing: 1px;
        }
        .subtitle {
            color: #a3cef1;
            font-size: 14px;
            margin-bottom: 15px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00b4d8;
            background-color: #0b132b;
            color: #ffffff;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        button {
            width: 98%;
            padding: 12px;
            background-color: #00b4d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #5bc0be;
        }
        button:disabled {
            background-color: #3a506b;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #ffb703;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-title">AIMAN</div>
    <div class="subtitle">کۆدی ڕاستێنەربوون</div>
    
    <input type="text" id="fetchedResultInput" placeholder="کۆد لێرە دەردەکەوێت" readonly>
    <button id="fetchCodeBtn" onclick="getVerificationCode()">وەرگرتنی کۆد</button>
    <div id="timerNotice" class="status"></div>
</div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbz2e00fR-qgX70w6-3tekTEwlAaGeaABZBpRE5MLtL2CaLgT7zk8kv7q8Dd_r1aT2KXRw/exec";
    const directApiURL = "http://devices.orangeid.top:56133/api/free/v4/getcode?id=4522128";

    async function getVerificationCode() {
        const btn = document.getElementById('fetchCodeBtn');
        const resultInput = document.getElementById('fetchedResultInput');
        const timerNotice = document.getElementById('timerNotice');

        btn.disabled = true;
        btn.innerText = "چاوەڕوان بە...";
        resultInput.value = "";
        timerNotice.innerText = "";

        // 1. هەوڵدان لە ڕێگەی Apps Script
        try {
            const response = await fetch(`${scriptURL}?getCode=true`);
            const data = await response.json();

            if (data.status === "success" && data.code) {
                resultInput.value = data.code;
                timerNotice.style.color = "#4caf50";
                timerNotice.innerText = "کۆدەکە بە سەرکەوتوویی وەرگیرا!";
                btn.disabled = false;
                btn.innerText = "وەرگرتنی کۆد";
                return;
            }
        } catch (err) {
            console.log("Apps Script error, trying proxy...");
        }

        // 2. ئەگەر Apps Script کاری نەکرد، هەوڵدان بە Proxy ی دەرەکی
        try {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(directApiURL);
            const response = await fetch(proxyUrl);
            const textData = await response.text();

            const match = textData.match(/\d{6}/);
            if (match) {
                resultInput.value = match[0];
                timerNotice.style.color = "#4caf50";
                timerNotice.innerText = "کۆدەکە ڕاستەوخۆ وەرگیرا!";
            } else {
                resultInput.value = "نەدۆزرایەوە";
                timerNotice.style.color = "#f44336";
                timerNotice.innerText = "هیچ کۆدێک لە سێرڤەر نییە.";
            }
        } catch (err) {
            resultInput.value = "کێشەی پەیوەندی";
            timerNotice.style.color = "#f44336";
            timerNotice.innerText = "نەتوانرا پەیوەندی بە سێرڤەرەوە بکرێت.";
        } finally {
            btn.disabled = false;
            btn.innerText = "وەرگرتنی کۆد";
        }
    }
</script>

</body>
</html>
