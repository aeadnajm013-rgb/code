<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYAD - وەرگرتنی خێرا</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            width: 340px;
            border: 1px solid #00b4d8;
        }
        .brand-title {
            color: #00b4d8;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.6);
        }
        .subtitle {
            color: #a3cef1;
            font-size: 14px;
            margin-bottom: 15px;
        }
        textarea {
            width: 92%;
            height: 110px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00b4d8;
            background-color: #0b132b;
            color: #00f5d4;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            resize: none;
            direction: ltr;
        }
        button {
            width: 98%;
            padding: 12px;
            background-color: #00b4d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5bc0be;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #ffb703;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-title">AYAD</div>
    <div class="subtitle">وەرگرتنی ئۆتۆماتیکی و ڕاستەوخۆ</div>
    
    <textarea id="fetchedResultInput" placeholder="لەپشکنینی بەردەوامدایە..." readonly></textarea>
    <button id="fetchCodeBtn" onclick="getVerificationCode()">نوێکردنەوەی ئێستا</button>
    <div id="timerNotice" class="status"></div>
</div>

<script>
    const directApiURL = "http://124.221.92.205:56133/api/free/v2/getcode?id=319199";

    async function getVerificationCode() {
        const resultInput = document.getElementById('fetchedResultInput');
        const timerNotice = document.getElementById('timerNotice');

        try {
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(directApiURL) + "&_t=" + Date.now();
            
            const response = await fetch(proxyUrl);
            const textData = await response.text();

            if (textData && textData.trim() !== "") {
                resultInput.value = textData.trim();
                timerNotice.style.color = "#4caf50";
                timerNotice.innerText = "دواین ڕەوش: زانیاری وەرگیرا";
            } else {
                resultInput.value = "دەق یان کۆد بوونی نییە";
                timerNotice.style.color = "#ffb703";
                timerNotice.innerText = "سێرڤەر وەڵامی بەتاڵی گەڕاندەوە";
            }
        } catch (err) {
            timerNotice.style.color = "#f44336";
            timerNotice.innerText = "کێشە لە پەیوەستبوون بە سێرڤەر";
        }
    }

    window.onload = function() {
        getVerificationCode();
        setInterval(getVerificationCode, 2000);
    };
</script>

</body>
</html>
