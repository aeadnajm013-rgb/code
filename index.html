<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYAD PHONE - Verification Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            width: 320px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00b4d8;
            background-color: #0b132b;
            color: #ffffff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        button {
            width: 98%;
            padding: 12px;
            background-color: #00b4d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5bc0be;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #ffb703;
        }
    </style>
</head>
<body>

<div class="card">
    <h3>کۆدی ڕاستێنەربوون</h3>
    <input type="text" id="fetchedResultInput" placeholder="کۆد لێرە دەردەکەوێت" readonly>
    <button id="fetchCodeBtn" onclick="getVerificationCode()">وەرگرتنی کۆد</button>
    <div id="timerNotice" class="status"></div>
</div>

<script>
    // Server API URL
    const scriptURL = "http://devices.orangeid.top:56133/api/free/v4/getcode?id=4522128";

    async function getVerificationCode() {
        const btn = document.getElementById('fetchCodeBtn');
        const resultInput = document.getElementById('fetchedResultInput');
        const timerNotice = document.getElementById('timerNotice');

        btn.disabled = true;
        btn.innerText = "چاوەڕوان بە...";
        resultInput.value = "";
        timerNotice.innerText = "";

        // Server-ampi suma aruskipañataki proxy (CORS blockage jark'aqañataki)
        const targetProxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(scriptURL);

        try {
            const response = await fetch(targetProxy);
            if (!response.ok) {
                throw new Error("Server response error: " + response.status);
            }

            const responseText = await response.text();
            let extractedCode = null;

            // 1. JSON parsing (data / code)
            try {
                const json = JSON.parse(responseText);
                if (json.data && /\d{6}/.test(String(json.data))) {
                    extractedCode = String(json.data).match(/\d{6}/)[0];
                } else if (json.code && /\d{6}/.test(String(json.code))) {
                    extractedCode = String(json.code).match(/\d{6}/)[0];
                }
            } catch (e) {
                // Not JSON, continue to raw text search
            }

            // 2. Regex search for 6-digit code (AppleID 登录验证码:845792)
            if (!extractedCode) {
                const match = responseText.match(/\d{6}/);
                if (match) {
                    extractedCode = match[0];
                }
            }

            // 3. Result verification
            if (extractedCode) {
                resultInput.value = extractedCode;
                timerNotice.style.color = "#4caf50";
                timerNotice.innerText = "کۆدەکە بە سەرکەوتوویی وەرگیرا!";
            } else {
                resultInput.value = "نەدۆزرایەوە";
                timerNotice.style.color = "#f44336";
                timerNotice.innerText = "کۆدی ٦ ژمارەیی نەدۆزرایەوە.";
            }

        } catch (err) {
            resultInput.value = "کێشە لە سەرڤەر";
            timerNotice.style.color = "#f44336";
            timerNotice.innerText = "پەیوەندی لەگەڵ سێرڤەر سەرکەوتوو نەبوو.";
        } finally {
            btn.disabled = false;
            btn.innerText = "وەرگرتنی کۆد";
        }
    }
</script>

</body>
</html>
