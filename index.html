<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دەرهێنانی کۆدی ٦ ژمارەیی</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            max-width: 400px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        .code-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e293b;
            border-radius: 8px;
            font-size: 45px;
            font-family: monospace;
            font-weight: bold;
            color: #38d9a9;
            letter-spacing: 5px;
            direction: ltr;
            min-height: 55px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>کۆدی ٦ ژمارەیی</h2>
    
    <button onclick="getCode()">نوێکردنەوە و هێنانی کۆد</button>
    
    <div id="status">کلیک لە دوگمەکە بکە...</div>
    
    <div class="code-box" id="codeDisplay">------</div>
</div>

<script>
    async function getCode() {
        const targetUrl = 'http://124.221.92.205:56133/api/free/v2/getcode?id=319199';
        
        // بەکارهێنانی سێرڤەری Proxy
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl + '&_t=' + Date.now());

        const statusDiv = document.getElementById('status');
        const codeDisplay = document.getElementById('codeDisplay');

        statusDiv.innerText = 'لە هەوڵی هێنانی کۆددایە...';
        statusDiv.style.color = '#007bff';
        codeDisplay.innerText = '......';

        try {
            const response = await fetch(proxyUrl);
            
            if (!response.ok) {
                throw new Error('کێشە لە وەڵامی سێرڤەر هەبوو');
            }

            const rawText = await response.text();
            let codeValue = null;

            // ١. هەوڵدان بۆ شیکردنەوەی JSON
            try {
                const jsonObj = JSON.parse(rawText);
                if (jsonObj && jsonObj.data !== undefined) {
                    codeValue = String(jsonObj.data);
                }
            } catch (e) {
                // ئەگەر JSON نەبوو کێشە نییە
            }

            // ٢. ئەگەر بە JSON نەدۆزرایەوە، بە Regex گەڕان لە ناو دەقدا دەکات
            if (!codeValue) {
                const matchData = rawText.match(/"data"\s*:\s*"([^"]+)"/);
                if (matchData) {
                    codeValue = matchData[1];
                }
            }

            // ٣. ئەگەر ئەوەش نەبوو، تەنها بەدوای ٦ ژمارەی بەدوای یەکدا دەگەڕێت
            if (!codeValue) {
                const matchNumber = rawText.match(/\b\d{6}\b/);
                if (matchNumber) {
                    codeValue = matchNumber[0];
                }
            }

            if (codeValue) {
                codeDisplay.style.fontSize = '45px';
                codeDisplay.innerText = codeValue;
                statusDiv.innerText = 'بەسەرکەوتوویی وەرگیرا!';
                statusDiv.style.color = 'green';
            } else {
                codeDisplay.style.fontSize = '18px';
                codeDisplay.innerText = rawText;
                statusDiv.innerText = 'ئەم دەقە هاتەوە لە سێرڤەرەوە:';
                statusDiv.style.color = 'orange';
            }

        } catch (error) {
            codeDisplay.style.fontSize = '35px';
            codeDisplay.innerText = 'ERROR';
            statusDiv.innerText = 'نەتوانرا پەیوەندی بە سێرڤەرەکە بپەیوەستێنرێت، دووبارە تاقی بکەرەوە.';
            statusDiv.style.color = 'red';
        }
    }
</script>

</body>
</html>
