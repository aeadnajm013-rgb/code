<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABO PHONE - Account Info</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .lang-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .lang-btn.active {
            background: #238636;
            color: #fff;
            border-color: #2ea043;
        }
        .warning-box {
            background: rgba(210, 153, 34, 0.15);
            border: 1px solid #d29922;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .warning-title {
            color: #f8e3a1;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .warning-text {
            color: #e3b341;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .btn-primary {
            width: 100%;
            background: #238636;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
        .field-group {
            margin-bottom: 12px;
        }
        .field-label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .input-with-copy {
            display: flex;
            gap: 8px;
        }
        .field-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            direction: ltr;
        }
        .copy-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        .action-fetch-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
        }
        .code-display-box {
            display: flex;
            gap: 8px;
            margin: 8px 0;
        }
        .code-input-field {
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            color: #7ee787;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
            direction: ltr;
        }
        .fetch-btn {
            width: 100%;
            background: #1f6feb;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .timer-text {
            font-size: 11px;
            color: #da3633;
            margin-top: 4px;
            height: 15px;
        }
        .show-modal-btn {
            width: 100%;
            background: transparent;
            border: 1px dashed #30363d;
            color: #8b949e;
            padding: 8px;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .close-btn {
            background: none;
            border: none;
            color: #8b949e;
            font-size: 18px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #238636;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .error-msg {
            color: #f85149;
            text-align: center;
            padding: 10px;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .acc-tag {
            font-size: 12px;
            color: #8b949e;
        }
        .acc-tag input {
            background: transparent;
            border: none;
            color: #58a6ff;
            font-weight: bold;
            width: 40px;
            text-align: center;
        }
        .wa-link {
            color: #2ea043;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('ku')">KU</button>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" onclick="setLanguage('ar')">AR</button>
        </div>

        <div class="header-info">
            <div class="acc-tag">
                <span id="lblAccount">ئەکاونت:</span> 
                <input type="text" id="accSmallInput" readonly value="-">
            </div>
            <a id="whatsappLink" class="wa-link" target="_blank">WhatsApp Support</a>
        </div>

        <!-- Warning Box -->
        <div id="warningBox" class="warning-box">
            <div id="warnTitle" class="warning-title">⚠️ ئاگادارییەکی گرنگ</div>
            <div id="warnText" class="warning-text">
                تکایە بەهیچ شێوەیەک ئەم Apple ID لە Settings ی موبایلەکەت داخل مەکە! تەنها لە App Store داخل بکە.<br><br>
                <strong>تکایە کاتێک Apple ID داخل کرد ڕاستەوخۆ بیخەرە سەر ژمارەی موبایلی خۆت.</strong>
            </div>
            <button id="acceptBtn" class="btn-primary" disabled onclick="acceptAgreement()">چاوەڕوان بە (5)...</button>
        </div>

        <!-- Dynamic Main Content -->
        <div id="content" style="display: none;"></div>
    </div>

    <!-- Hidden Info Modal -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="modalTitle" style="font-size: 14px;">🔐 زانیارییە شاراوەکان</h4>
                <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            </div>
            
            <div class="field-group">
                <label id="lblBirthday" class="field-label">ڕۆژی لەدایکبوون (Birthday)</label>
                <div class="input-with-copy">
                    <input type="text" id="bdayInput" class="field-input" readonly>
                    <button id="btnCopyBday" class="copy-btn" onclick="copyText('bdayInput')">کۆپی</button>
                </div>
            </div>

            <div class="field-group" style="margin-bottom: 0;">
                <label id="lblPhone" class="field-label">ژمارەی تەلەفۆن (Phone)</label>
                <div class="input-with-copy">
                    <input type="text" id="phoneInput" class="field-input" readonly>
                    <button id="btnCopyPhone" class="copy-btn" onclick="copyText('phoneInput')">کۆپی</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">بە سەرکەوتوویی کۆپی کرا!</div>

    <script>
        const translations = {
            ku: {
                dir: "rtl",
                lblAccount: "ئەکاونت:",
                warnTitle: "⚠️ ئاگادارییەکی گرنگ",
                warnText: "تکایە بەهیچ شێوەیەک ئەم Apple ID لە Settings ی موبایلەکەت داخل مەکە! تەنها لە App Store داخل بکە.<br><br><strong>تکایە کاتێک Apple ID داخل کرد ڕاستەوخۆ بیخەرە سەر ژمارەی موبایلی خۆت.</strong>",
                btnWait: "چاوەڕوان بە ({s})...",
                btnAgree: "من ڕازیم",
                loading: "چاوەڕوان بە، زانیارییەکان دەهێنرێن...",
                errNoAcc: "تکایە ژمارەی ئەکاونت لە لینکەکەدا دیاری بکە (نموونە: ?account=1)",
                lblEmail: "ئیمەیل (Email)",
                lblPass: "پاسوۆرد (Password)",
                lblCode: "کۆدی دڵنیایی",
                btnGetCode: "وەرگرتنی کۆدی دڵنیایی",
                btnShowHidden: "👁️ پێشان دانی زانیارییە شاراوەکان (روز / ژمارە)",
                modalTitle: "🔐 زانیارییە شاراوەکان",
                lblBday: "ڕۆژی لەدایکبوون (Birthday)",
                lblPhone: "ژمارەی تەلەفۆن (Phone)",
                btnCopy: "کۆپی",
                toastCopied: "بە سەرکەوتوویی کۆپی کرا!",
                codeNoLink: "لینک نییە",
                codeNotFound: "نەدۆزرایەوە",
                codeErr: "هەڵە",
                codeTimer: "کۆدەکە دوای {s} چرکەی تر دەسڕێتەوە",
                codeExpired: "کۆدەکە سڕایەوە! کۆتایی هات."
            },
            en: {
                dir: "ltr",
                lblAccount: "Account:",
                warnTitle: "⚠️ Important Notice",
                warnText: "Please DO NOT sign in with this Apple ID in device Settings! Only sign in through the App Store.<br><br><strong>Once signed in, immediately link it to your own phone number.</strong>",
                btnWait: "Please wait ({s})...",
                btnAgree: "I Agree",
                loading: "Please wait, fetching data...",
                errNoAcc: "Please specify an account number in the URL (e.g. ?account=1)",
                lblEmail: "Email",
                lblPass: "Password",
                lblCode: "Verification Code",
                btnGetCode: "Get Verification Code",
                btnShowHidden: "👁️ Show Hidden Info (Birthday / Phone)",
                modalTitle: "🔐 Hidden Information",
                lblBday: "Birthday",
                lblPhone: "Phone Number",
                btnCopy: "Copy",
                toastCopied: "Copied successfully!",
                codeNoLink: "No Link",
                codeNotFound: "Not Found",
                codeErr: "Error",
                codeTimer: "Code expires in {s} seconds",
                codeExpired: "Code expired!"
            },
            ar: {
                dir: "rtl",
                lblAccount: "الحساب:",
                warnTitle: "⚠️ تنبيه هام جداً",
                warnText: "الرجاء عدم تسجيل الدخول بـ Apple ID في إعدادات الهاتف (Settings)! استخدمه في App Store فقط.<br><br><strong>عند تسجيل الدخول، يرجى ربطه برقم هاتفك الشخصي فوراً.</strong>",
                btnWait: "انتظر قليلاً ({s})...",
                btnAgree: "أنا أوافق",
                loading: "جاري تحميل البيانات، يرجى الانتظار...",
                errNoAcc: "يرجى تحديد رقم الحساب في الرابط (مثال: ?account=1)",
                lblEmail: "البريد الإلكتروني (Email)",
                lblPass: "كلمة السر (Password)",
                lblCode: "رمز التحقق",
                btnGetCode: "الحصول على رمز التحقق",
                btnShowHidden: "👁️ إظهار المعلومات المخفية (التاريخ / الرقم)",
                modalTitle: "🔐 المعلومات المخفية",
                lblBday: "تاريخ الميلاد (Birthday)",
                lblPhone: "رقم الهاتف (Phone)",
                btnCopy: "نسخ",
                toastCopied: "تم النسخ بنجاح!",
                codeNoLink: "لا يوجد رابط",
                codeNotFound: "غير موجود",
                codeErr: "خطأ",
                codeTimer: "سيتم حذف الرمز خلال {s} ثانية",
                codeExpired: "انتهت صلاحية الرمز!"
            }
        };

        let currentLang = 'ku';
        const urlParams = new URLSearchParams(window.location.search);
        const accountNumber = urlParams.get('account');
        
        // Google Apps Script URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz2e00fR-qgX70w6-3tekTEwlAaGeaABZBpRE5MLtL2CaLgT7zk8kv7q8Dd_r1aT2KXRw/exec';
        
        let countdownTimer = null;
        let fetchedData = null;
        let waitTime = 5;

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.documentElement.dir = t.dir;
            document.documentElement.lang = lang;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
            });

            document.getElementById('lblAccount').innerText = t.lblAccount;
            document.getElementById('warnTitle').innerText = t.warnTitle;
            document.getElementById('warnText').innerHTML = t.warnText;
            document.getElementById('modalTitle').innerText = t.modalTitle;
            document.getElementById('lblBirthday').innerText = t.lblBday;
            document.getElementById('lblPhone').innerText = t.lblPhone;
            document.getElementById('btnCopyBday').innerText = t.btnCopy;
            document.getElementById('btnCopyPhone').innerText = t.btnCopy;
            document.getElementById('toast').innerText = t.toastCopied;

            if (waitTime > 0) {
                document.getElementById('acceptBtn').innerText = t.btnWait.replace('{s}', waitTime);
            } else {
                document.getElementById('acceptBtn').innerText = t.btnAgree;
            }

            if (fetchedData) {
                renderData(fetchedData);
            }
        }

        if (accountNumber) {
            document.getElementById('accSmallInput').value = accountNumber;
            const phone = "9647507539339";
            const message = encodeURIComponent(`Hello, I have account number ${accountNumber} at ABO PHONE.`);
            document.getElementById('whatsappLink').href = `https://wa.me/${phone}?text=${message}`;

            fetch(`${scriptURL}?account=${accountNumber}`)
                .then(response => response.json())
                .then(res => {
                    fetchedData = res;
                })
                .catch(err => {
                    fetchedData = { status: 'error', message: 'Connection Error / هەڵە لە پەیوەندی' };
                });
        }

        const acceptBtn = document.getElementById('acceptBtn');
        const waitTimer = setInterval(() => {
            waitTime--;
            const t = translations[currentLang];
            if (waitTime > 0) {
                acceptBtn.innerText = t.btnWait.replace('{s}', waitTime);
            } else {
                clearInterval(waitTimer);
                acceptBtn.innerText = t.btnAgree;
                acceptBtn.disabled = false;
            }
        }, 1000);

        function acceptAgreement() {
            document.getElementById('warningBox').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const t = translations[currentLang];
            if (!accountNumber) {
                document.getElementById('content').innerHTML = `<div class="error-msg">${t.errNoAcc}</div>`;
                return;
            }

            if (fetchedData) {
                renderData(fetchedData);
            } else {
                const checkInterval = setInterval(() => {
                    if (fetchedData) {
                        clearInterval(checkInterval);
                        renderData(fetchedData);
                    }
                }, 200);
            }
        }

        function renderData(res) {
            const t = translations[currentLang];
            if (res.status === 'success') {
                let d = res.data;
                
                document.getElementById('bdayInput').value = d.birthday || '';
                document.getElementById('phoneInput').value = d.phone || '';

                document.getElementById('content').innerHTML = `
                    <div class="field-group">
                        <label class="field-label">${t.lblEmail}</label>
                        <div class="input-with-copy">
                            <input type="text" id="emailInput" class="field-input" value="${d.email || ''}" readonly>
                            <button class="copy-btn" onclick="copyText('emailInput')">${t.btnCopy}</button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label">${t.lblPass}</label>
                        <div class="input-with-copy">
                            <input type="text" id="passInput" class="field-input" value="${d.password || ''}" readonly>
                            <button class="copy-btn" onclick="copyText('passInput')">${t.btnCopy}</button>
                        </div>
                    </div>

                    <div class="action-fetch-box">
                        <label class="field-label">${t.lblCode}</label>
                        
                        <div class="code-display-box">
                            <input type="text" id="fetchedResultInput" class="code-input-field" value="" placeholder="------" readonly>
                            <button class="copy-btn" style="border-radius: 6px; min-height: 28px; padding: 0 10px; font-size: 11px;" onclick="copyText('fetchedResultInput')">${t.btnCopy}</button>
                        </div>
                        <div id="timerNotice" class="timer-text"></div>

                        <button class="fetch-btn" onclick="fetchTargetLink('${d.link || ''}')">${t.btnGetCode}</button>
                    </div>

                    <button class="show-modal-btn" onclick="toggleModal(true)">
                        ${t.btnShowHidden}
                    </button>
                `;
            } else {
                document.getElementById('content').innerHTML = `<div class="error-msg">${res.message}</div>`;
            }
        }

        function toggleModal(show) {
            const modal = document.getElementById('infoModal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Error");
            }
        }

        function fetchTargetLink(linkUrl) {
            const resultInput = document.getElementById('fetchedResultInput');
            const timerNotice = document.getElementById('timerNotice');
            const t = translations[currentLang];
            
            clearInterval(countdownTimer);
            timerNotice.innerText = "";
            playBeepSound();

            if (!linkUrl || linkUrl === '#') {
                resultInput.value = t.codeNoLink;
                return;
            }

            resultInput.value = "...";

            let finalUrl = linkUrl;
            if (linkUrl.startsWith('http://')) {
                finalUrl = scriptURL + "?fetchUrl=" + encodeURIComponent(linkUrl);
            }

            fetch(finalUrl)
                .then(res => res.text())
                .then(text => {
                    const match = text.match(/\b\d{6}\b/);
                    if (match) {
                        resultInput.value = match[0];
                        startCodeTimer(60);
                    } else if (text.trim()) {
                        resultInput.value = text.trim();
                        startCodeTimer(60);
                    } else {
                        resultInput.value = t.codeNotFound;
                    }
                })
                .catch(err => {
                    let fallbackUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(linkUrl);
                    fetch(fallbackUrl)
                        .then(res => res.text())
                        .then(text => {
                            const match = text.match(/\b\d{6}\b/);
                            if (match) {
                                resultInput.value = match[0];
                                startCodeTimer(60);
                            } else {
                                resultInput.value = t.codeNotFound;
                            }
                        })
                        .catch(() => {
                            resultInput.value = t.codeErr;
                        });
                });
        }

        function startCodeTimer(seconds) {
            let left = seconds;
            const timerNotice = document.getElementById('timerNotice');
            const resultInput = document.getElementById('fetchedResultInput');
            const t = translations[currentLang];

            timerNotice.innerText = t.codeTimer.replace('{s}', left);

            countdownTimer = setInterval(() => {
                left--;
                if (left > 0) {
                    timerNotice.innerText = t.codeTimer.replace('{s}', left);
                } else {
                    clearInterval(countdownTimer);
                    resultInput.value = "";
                    timerNotice.innerText = t.codeExpired;
                }
            }, 1000);
        }

        function copyText(inputId) {
            const inputEl = document.getElementById(inputId);
            if (!inputEl || !inputEl.value) return;

            navigator.clipboard.writeText(inputEl.value).then(() => {
                showToast();
            }).catch(() => {
                inputEl.select();
                document.execCommand('copy');
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
