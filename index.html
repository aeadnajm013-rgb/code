<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMAN - وەرگرتنی دەق و کۆد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            width: 350px;
            border: 1px solid #00b4d8;
        }
        .brand-title {
            color: #00b4d8;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.6);
        }
        .subtitle {
            color: #a3cef1;
            font-size: 14px;
            margin-bottom: 15px;
        }
        textarea {
            width: 92%;
            height: 120px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00b4d8;
            background-color: #0b132b;
            color: #00f5d4;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            resize: none;
            direction: ltr;
        }
        button {
            width: 98%;
            padding: 12px;
            background-color: #00b4d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5bc0be;
        }
        button:disabled {
            background-color: #3a506b;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #ffb703;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-title">AIMAN</div>
    <div class="subtitle">خوێندنەوەی ڕاستەوخۆی وەڵامی سێرڤەر</div>
    
    <textarea id="fetchedResultInput" placeholder="چاوەڕوان بە... دەقەکە لە پاش پشتەوە وەرپێڕێزرێت" readonly></textarea>
    <button id="fetchCodeBtn" onclick="getVerificationCode()">دووبارە وەرگرتنەوە</button>
    <div id="timerNotice" class="status"></div>
</div>

<script>
    const directApiURL = "http://124.221.92.205:56133/api/free/v2/getcode?id=319199";

    async function getVerificationCode() {
        const btn = document.getElementById('fetchCodeBtn');
        const resultInput = document.getElementById('fetchedResultInput');
        const timerNotice = document.getElementById('timerNotice');

        btn.disabled = true;
        btn.innerText = "چاوەڕوان بە...";
        resultInput.value = "لە پشکنیندایە...";
        timerNotice.innerText = "";

        try {
            // بەکارهێنانی Proxy بۆ تێپەڕاندنی کێشەی CORS
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(directApiURL) + "&t=" + new Date().getTime();
            const response = await fetch(proxyUrl);
            const textData = await response.text();

            if (textData && textData.trim() !== "") {
                // تەواوی ئەو دەق و هێمایانەی سێرڤەر دەیگەرێنێتەوە ڕاستەوخۆ نیشانی دەدات
                resultInput.value = textData.trim();
                timerNotice.style.color = "#4caf50";
                timerNotice.innerText = "وەڵامی سێرڤەر بە تەواوی وەستێنرا و خوێنرایەوە!";
            } else {
                resultInput.value = "هیچ دەقێک نییە";
                timerNotice.style.color = "#ffb703";
                timerNotice.innerText = "سێرڤەرەکە وەڵامێکی بەتاڵی گەڕاندەوە.";
            }
        } catch (err) {
            resultInput.value = "کێشەی پەیوەندی";
            timerNotice.style.color = "#f44336";
            timerNotice.innerText = "نەتوانرا لە پاش پشتەوە پەیوەندی بە سێرڤەرەکەوە بکرێت.";
        } finally {
            btn.disabled = false;
            btn.innerText = "دووبارە وەرگرتنەوە";
        }
    }

    // هەرکە پەڕەکە کرایەوە خۆکارانە دەست بە پشکنین دەکات
    window.onload = function() {
        getVerificationCode();
    };
</script>

</body>
</html>
