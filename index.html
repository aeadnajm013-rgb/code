<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دەرهێنانی کۆد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f8; text-align: center; padding-top: 50px; }
        .card { background: white; max-width: 450px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 14px 20px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0056b3; }
        .code { font-size: 42px; font-weight: bold; color: #28a745; margin-top: 20px; letter-spacing: 5px; font-family: monospace; }
        #status { font-size: 14px; color: #666; margin-top: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h2>کۆدی ٦ ژمارەیی</h2>
    <button onclick="getCodeWithWait()">نوێکردنەوە و هێنانی کۆد</button>
    <div id="status">کلیک لە دوگمەکە بکە...</div>
    <div class="code" id="result">------</div>
</div>

<script>
    function getCodeWithWait() {
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        
        statusDiv.innerText = 'پەڕەکە کرایەوە... تکایە ٢ تا ٣ چرکە چاوەڕێ بکە';
        statusDiv.style.color = '#007bff';
        resultDiv.innerText = '......';

        const targetUrl = 'http://124.221.92.205:56133/api/free/v2/getcode?id=319199&_t=' + Date.now();
        
        // کردنیەوەی لینکەکە لە پەنجەرەیەکی بچووکدا
        const popup = window.open(targetUrl, 'codeWindow', 'width=300,height=300,left=2000,top=2000');

        if (!popup) {
            statusDiv.innerText = 'تکایە ڕێگە بە Pop-up ببدە لە وێبگەڕەکەتدا!';
            statusDiv.style.color = 'red';
            resultDiv.innerText = 'ERROR';
            return;
        }

        let attempts = 0;
        const maxAttempts = 15; // پشکنین بۆ ماوەی ٧.٥ چرکە (هەر ٠.٥ چرکەیەک جارێک)

        const interval = setInterval(() => {
            attempts++;

            try {
                if (popup.document && popup.document.body) {
                    const text = popup.document.body.innerText || popup.document.body.textContent || '';
                    
                    // گەڕان بەدوای ٦ ژمارەکەدا
                    const match = text.match(/\b\d{6}\b/);

                    if (match) {
                        resultDiv.innerText = match[0];
                        statusDiv.innerText = 'بەسەرکەوتوویی وەرگیرا!';
                        statusDiv.style.color = 'green';
                        
                        clearInterval(interval);
                        popup.close(); // داخرانی پەنجەرەکە دوای وەرگرتنی کۆدەکە
                    }
                }
            } catch (e) {
                // ئەگەر کێشەی دەستگەیشتن هەبوو
            }

            if (attempts >= maxAttempts) {
                clearInterval(interval);
                if (popup && !popup.closed) popup.close();
                
                if (resultDiv.innerText === '......') {
                    resultDiv.innerText = 'ERROR';
                    statusDiv.innerText = 'وێبگەڕەکەت ڕێگەی نەدا زانیارییەکان لە پەڕەکە بخوێنرێتەوە (CORS Block)';
                    statusDiv.style.color = 'red';
                }
            }
        }, 500);
    }
</script>

</body>
</html>
