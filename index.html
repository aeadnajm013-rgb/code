<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دەرهێنانی کۆدی ٦ ژمارەیی</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            max-width: 400px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h2 { color: #333; margin-bottom: 20px; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-size: 14px; color: #666; }
        .code-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e293b;
            border-radius: 8px;
            font-size: 45px;
            font-family: monospace;
            font-weight: bold;
            color: #38d9a9;
            letter-spacing: 5px;
            direction: ltr;
            min-height: 55px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>کۆدی ٦ ژمارەیی</h2>
    
    <button onclick="getCode()">نوێکردنەوە و هێنانی کۆد</button>
    
    <div id="status">کلیک لە دوگمەکە بکە...</div>
    
    <div class="code-box" id="codeDisplay">------</div>
</div>

<script>
    function getCode() {
        const statusDiv = document.getElementById('status');
        const codeDisplay = document.getElementById('codeDisplay');

        statusDiv.innerText = 'لە هەوڵی هێنانی کۆددایە...';
        statusDiv.style.color = '#007bff';
        codeDisplay.innerText = '......';

        // سڕینەوەی سکریپتی کۆن ئەگەر هەبێت
        const oldScript = document.getElementById('jsonpScript');
        if (oldScript) oldScript.remove();

        // دروستکردنی کات بۆ دەستکەوتنی کۆدی نوێ بێ Cache
        const targetUrl = 'http://124.221.92.205:56133/api/free/v2/getcode?id=319199&_t=' + Date.now();

        // دروستکردنی Script Tag بۆ دەربازبوون لە CORS
        const script = document.createElement('script');
        script.id = 'jsonpScript';
        script.src = targetUrl;

        // کاتێک سکریپتەکە باربوو
        script.onload = function() {
            statusDiv.innerText = 'بەسەرکەوتوویی وەرگیرا!';
            statusDiv.style.color = 'green';
        };

        script.onerror = function() {
            // ئەگەر وێبگەڕەکە ڕێگەی نەدا ڕاستەوخۆ دەقەکە بخوێنێتەوە بەهۆی CORS
            statusDiv.innerText = 'هەڵە لە هێنانی زانیاری! (کێشەی ڕێگەپێدانی سێرڤەر)';
            statusDiv.style.color = 'red';
            codeDisplay.innerText = 'ERROR';
        };

        document.body.appendChild(script);
    }

    // فەنکشن بۆ وەرگرتنی وەڵامی JSON لە سێرڤەرەکەوە
    function handleResponse(response) {
        const codeDisplay = document.getElementById('codeDisplay');
        if (response && response.data) {
            codeDisplay.innerText = response.data;
        }
    }
</script>

</body>
</html>
