<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>AYAD PHONE</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --text-color: #f3f4f6;
            --input-bg: #1f2937;
            --border-color: #374151;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--secondary-glow);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(45deg, var(--secondary-glow), var(--primary-glow));
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .result-box {
            display: none;
            flex-direction: column;
            gap: 15px;
            text-align: right;
            margin-top: 15px;
        }

        .info-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-row label {
            font-size: 14px;
            color: #9ca3af;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .btn-copy {
            padding: 10px 15px;
            font-size: 14px;
            background: #374151;
            color: #fff;
        }

        .btn-code {
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(45deg, #10b981, #059669);
            color: #fff;
        }

        .code-display {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 242, 254, 0.05);
            border: 1px dashed var(--primary-glow);
            border-radius: 10px;
            text-align: center;
        }

        .code-display input {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--primary-glow);
            background: transparent;
            border: none;
        }

        .timer {
            font-size: 13px;
            color: #f59e0b;
            margin-top: 5px;
        }

        .error-msg {
            color: #ef4444;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">AYAD PHONE</div>

    <div class="search-box">
        <input type="text" id="accountInput" placeholder="ژمارەی ئەکاونت بنووسە...">
        <button onclick="searchAccount()">گەڕان</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-box" id="resultBox">
        <div class="info-row">
            <label>ئیمەیڵ:</label>
            <div class="input-group">
                <input type="text" id="emailInput" readonly>
                <button class="btn-copy" onclick="copyText('emailInput')">کۆپی</button>
            </div>
        </div>

        <div class="info-row">
            <label>وشەی تێپەڕ (Password):</label>
            <div class="input-group">
                <input type="text" id="passInput" readonly>
                <button class="btn-copy" onclick="copyText('passInput')">کۆپی</button>
            </div>
        </div>

        <div class="info-row">
            <label>بەرواری لەدایکبوون:</label>
            <input type="text" id="dobInput" readonly>
        </div>

        <div class="info-row">
            <label>ژمارەی تلفۆن:</label>
            <input type="text" id="phoneInput" readonly>
        </div>

        <button class="btn-code" onclick="requestCode()">وەرگرتنی کۆدی دڵنیایی</button>

        <div class="code-display" id="codeSection" style="display: none;">
            <input type="text" id="codeInput" readonly value="------">
            <div class="timer" id="timerText"></div>
        </div>
    </div>
</div>

<script>
    // ** ئەنتەر بکە لینکی APPS SCRIPTەکەت لێرە **
    const scriptURL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID_HERE/exec";

    let currentCodeLink = "";
    let countdownTimer = null;

    function searchAccount() {
        const account = document.getElementById('accountInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');

        if (!account) {
            errorMsg.innerText = "تکایە ژمارەی ئەکاونت بنووسە";
            errorMsg.style.display = "block";
            resultBox.style.display = "none";
            return;
        }

        errorMsg.style.display = "none";

        fetch(`${scriptURL}?account=${encodeURIComponent(account)}`)
            .then(res => res.json())
            .then(response => {
                if (response.status === "success") {
                    const data = response.data;
                    document.getElementById('emailInput').value = data.email || '';
                    document.getElementById('passInput').value = data.password || '';
                    document.getElementById('dobInput').value = data.birthday || '';
                    document.getElementById('phoneInput').value = data.phone || '';

                    currentCodeLink = data.link || data.codeLink || "";

                    document.getElementById('codeSection').style.display = 'none';
                    document.getElementById('codeInput').value = '------';
                    document.getElementById('timerText').innerText = '';
                    if (countdownTimer) clearInterval(countdownTimer);

                    resultBox.style.display = "flex";
                } else {
                    errorMsg.innerText = response.message || "ئەکاونتەکە نەدۆزرایەوە";
                    errorMsg.style.display = "block";
                    resultBox.style.display = "none";
                }
            })
            .catch(err => {
                errorMsg.innerText = "کێشەیەک لە پەیوەندی هەبوو";
                errorMsg.style.display = "block";
                resultBox.style.display = "none";
            });
    }

    function requestCode() {
        const codeSection = document.getElementById('codeSection');
        const codeInput = document.getElementById('codeInput');
        const timerText = document.getElementById('timerText');

        codeSection.style.display = 'block';

        if (!currentCodeLink || currentCodeLink.trim() === '') {
            codeInput.value = "لینک نییە";
            timerText.innerText = '';
            return;
        }

        codeInput.value = "کۆد دەهێنرێت...";
        timerText.innerText = '';

        if (countdownTimer) clearInterval(countdownTimer);

        // بەکارهێنانی پرۆکسی بۆ چارەسەرکردنی کێشەی HTTP و CORS
        let targetUrl = currentCodeLink.trim();
        let proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

        fetch(proxyUrl)
            .then(res => {
                if (!res.ok) throw new Error("Network response was not ok");
                return res.text();
            })
            .then(text => {
                // دۆزینەوەی کۆدی 4 تا 6 ڕەقەمی
                const match = text.match(/\b\d{4,6}\b/);
                if (match) {
                    codeInput.value = match[0];
                    let timeLeft = 60;
                    timerText.innerText = `کۆدەکە پاش ${timeLeft} چڕکە بەسەر دەچێت`;

                    countdownTimer = setInterval(() => {
                        timeLeft--;
                        if (timeLeft > 0) {
                            timerText.innerText = `کۆدەکە پاش ${timeLeft} چڕکە بەسەر دەچێت`;
                        } else {
                            clearInterval(countdownTimer);
                            codeInput.value = '------';
                            timerText.innerText = 'کۆدەکە بەسەرچوو';
                        }
                    }, 1000);
                } else {
                    codeInput.value = "کۆدەکە نەدۆزرایەوە";
                }
            })
            .catch(err => {
                // لە حاڵەتی کێشەدا، پرۆکسی دووەم تاقی دەکاتەوە
                fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl))
                    .then(r => r.text())
                    .then(tData => {
                        const match2 = tData.match(/\b\d{4,6}\b/);
                        if (match2) {
                            codeInput.value = match2[0];
                        } else {
                            codeInput.value = "کۆدەکە نەدۆزرایەوە";
                        }
                    })
                    .catch(() => {
                        codeInput.value = "کێشە لە هێنانی کۆد";
                    });
            });
    }

    function copyText(id) {
        const input = document.getElementById(id);
        input.select();
        document.execCommand('copy');
    }
</script>

</body>
</html>
