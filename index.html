<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگرتنی کۆد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1b2a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1b263b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.5);
            text-align: center;
            width: 320px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00b4d8;
            background-color: #0d1b2a;
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        button {
            width: 98%;
            padding: 10px;
            background-color: #00b4d8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #90e0ef;
            color: #000;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #e0a96d;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>کۆدی ڕاستێنەربوون</h3>
    <input type="text" id="codeDisplay" placeholder="کۆد لێرە دەردەکەوێت" readonly>
    <button id="fetchBtn" onclick="getCodeFromLink()">وەرگرتنی کۆد</button>
    <div id="statusMsg" class="status"></div>
</div>

<script>
async function getCodeFromLink() {
    const btn = document.getElementById('fetchBtn');
    const display = document.getElementById('codeDisplay');
    const status = document.getElementById('statusMsg');
    
    // لێنکە تایبەتەکەی تۆ
    const targetUrl = "http://devices.orangeid.top:56133/api/free/v4/getcode?id=4522128";
    
    // بەکارهێنانی CORS Proxy بۆ ئەوەی وێبگەڕ ڕێگری لە داواکارییەکە نەگرێت
    const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

    btn.disabled = true;
    btn.innerText = "چاوەڕوان بە...";
    display.value = "";
    status.innerText = "";

    try {
        const response = await fetch(proxyUrl);
        const responseText = await response.text();
        
        let extractedCode = null;

        // 1. پشکنین ئەگەر وەڵامەکە JSON بێت
        try {
            const jsonData = JSON.parse(responseText);
            if (jsonData.data && /\d{6}/.test(jsonData.data.toString())) {
                extractedCode = jsonData.data.toString().match(/\d{6}/)[0];
            } else if (jsonData.code && /\d{6}/.test(jsonData.code.toString())) {
                extractedCode = jsonData.code.toString().match(/\d{6}/)[0];
            }
        } catch (e) {
            // ئەگەر JSON نەبوو دەچێتە بەشی دەق
        }

        // 2. ئەگەر لە JSON نەبوو، گەڕان بەدوای ٦ ژمارە لەناو دەقەکە (وەک ڕستەی چینەیەکە)
        if (!extractedCode) {
            const match = responseText.match(/\d{6}/);
            if (match) {
                extractedCode = match[0];
            }
        }

        // 3. نیشاندانی ئەنجام
        if (extractedCode) {
            display.value = extractedCode;
            status.style.color = "#4CAF50";
            status.innerText = "کۆدەکە بە سەرکەوتوویی وەرگیرا!";
        } else {
            display.value = "نەدۆزرایەوە";
            status.style.color = "#FF5252";
            status.innerText = "هیچ کۆدێکی ٦ ژمارەیی لە لینکەکەدا نەبوو.";
        }

    } catch (err) {
        display.value = "هەڵە";
        status.style.color = "#FF5252";
        status.innerText = "کێشەیەک لە پەیوەندی بە لینکەکەوە ڕووی دا.";
    } finally {
        btn.disabled = false;
        btn.innerText = "وەرگرتنی کۆد";
    }
}
</script>

</body>
</html>
