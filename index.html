<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>هێنانی کۆدی ٦ ژمارەیی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f8; text-align: center; padding-top: 50px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .code { font-size: 40px; font-weight: bold; color: #28a745; margin-top: 15px; letter-spacing: 4px; font-family: monospace; }
        #status { font-size: 13px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>کۆدی ٦ ژمارەیی</h2>
    <button onclick="getCode()">نوێکردنەوە و هێنانی کۆد</button>
    <div id="status">داگرتنی دوگمەکە بکە...</div>
    <div class="code" id="result">------</div>
</div>

<script>
    async function getCode() {
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        
        // ڕاستەوخۆ دەچێت بۆ لینکەکە بێ هیچ پرۆکسییەک (زۆر خێرا)
        const targetUrl = 'http://124.221.92.205:56133/api/free/v2/getcode?id=319199&_t=' + new Date().getTime();

        statusDiv.innerText = 'لە پەیوەندیدایە...';
        resultDiv.innerText = '......';

        try {
            const response = await fetch(targetUrl);
            const text = await response.text();
            
            // جوداکردنەوەی ٦ ژمارەکە
            const match = text.match(/\b\d{6}\b/);
            
            if (match) {
                resultDiv.innerText = match[0];
                statusDiv.innerText = 'بەسەرکەوتوویی وەرگیرا!';
                statusDiv.style.color = 'green';
            } else {
                resultDiv.innerText = text;
                statusDiv.innerText = 'دەقەکە وەگیرا، بەڵام ٦ ژمارە تێیدا نەبوو!';
            }
        } catch (err) {
            resultDiv.innerText = 'ERROR';
            statusDiv.innerText = 'ڕێگری CORS ڕوویدا! تکایە زیادکراوی Allow CORS چالاک بکە لە وێبگەڕەکەت.';
            statusDiv.style.color = 'red';
        }
    }
</script>

</body>
</html>
