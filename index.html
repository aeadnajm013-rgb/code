<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMAN - وەرگرتنی کۆد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            width: 340px;
            border: 1px solid #00b4d8;
        }
        .brand-title {
            color: #00b4d8;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.6);
        }
        .subtitle {
            color: #a3cef1;
            font-size: 14px;
            margin-bottom: 15px;
        }
        textarea {
            width: 90%;
            height: 100px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00b4d8;
            background-color: #0b132b;
            color: #00f5d4;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            resize: none;
        }
        button {
            width: 98%;
            padding: 12px;
            background-color: #00b4d8;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5bc0be;
        }
        button:disabled {
            background-color: #3a506b;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #ffb703;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-title">AIMAN</div>
    <div class="subtitle">وەرگرتنی خۆکارانەی کۆد</div>
    
    <textarea id="fetchedResultInput" placeholder="چاوەڕوان بە... کۆد یان دەقەکە بار دەکرێت" readonly></textarea>
    <button id="fetchCodeBtn" onclick="getVerificationCode()">دووبارە وەرگرتنەوە</button>
    <div id="timerNotice" class="status"></div>
</div>

<script>
    const directApiURL = "http://124.221.92.205:56133/api/free/v2/getcode?id=319199";

    async function getVerificationCode() {
        const btn = document.getElementById('fetchCodeBtn');
        const resultInput = document.getElementById('fetchedResultInput');
        const timerNotice = document.getElementById('timerNotice');

        btn.disabled = true;
        btn.innerText = "چاوەڕوان بە...";
        resultInput.value = "لەپشکنیندایە...";
        timerNotice.innerText = "";

        try {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(directApiURL) + "&t=" + new Date().getTime();
            const response = await fetch(proxyUrl);
            const textData = await response.text();

            // هەوڵدان بۆ دۆزینەوەی کۆدی ٦ ژمارەیی
            const match = textData.match(/\d{6}/);
            
            if (match) {
                resultInput.value = match[0];
                timerNotice.style.color = "#4caf50";
                timerNotice.innerText = "کۆدەکە بە سەرکەوتوویی وەرگیرا!";
            } else {
                // ئەگەر ٦ ژمارەش نەبوو، دەقی وەڵامەکە بەتەواوی نیشان دەدات
                resultInput.value = textData;
                timerNotice.style.color = "#ffb703";
                timerNotice.innerText = "دەقی تەواوی وەڵامی سێرڤەر وەرگیرا.";
            }
        } catch (err) {
            resultInput.value = "کێشەی پەیوەندی";
            timerNotice.style.color = "#f44336";
            timerNotice.innerText = "نەتوانرا پەیوەندی بە سێرڤەرەوە بکرێت.";
        } finally {
            btn.disabled = false;
            btn.innerText = "دووبارە وەرگرتنەوە";
        }
    }

    // هێنانی کۆدەکە بە شێوەی ئۆتۆماتیکی لەگەڵ بەگەڕخستنی پەڕەکە
    window.onload = function() {
        getVerificationCode();
    };
</script>

</body>
</html>
